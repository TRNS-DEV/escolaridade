<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listas Ordenadas e não ordenadas</title>
</head>
<body>
    <a href="../index.html">Index</a>
    <h1>Listas não ordenadas e Não ordenadas</h1>
    <h2>Lista não ordenada</h2>
    <ul type="A">
        <li>café</li>
        <li>Chá</li>
        <li>leite</li>
    </ul>
    <h3>Segunda lista</h3>
    <ul>
        <li>café</li>
        <ul>
            <li>Grãos torrados</li>
            <li>Torado e moido</li>
        </ul>
        <li>leite</li>
        <dl>
            <dt>Café</dt>
            <dd>Liquido quente</dd>
            <dt>leite</dt>
            <dd>Bebida fria</dd>
        </dl>
    </ul>
</body>
</html>
